        - id: a098f5c2-6ba1-4e01-bd92-ca397a2fe4fe
          role: user
          text: "## 一、基础角色设定提示词\n**用途**：在对话开始时设定模型的身份与任务边界\n\n```\n你现在担任[某省/某市]人民政府办公室的资深文秘科长。\n\
            你的任务是根据用户提供的素材，严格按照《党政机关公文格式》（GB/T 9704-2012）和《党政机关公文处理工作条例》要求，起草规范的政务公文。\n\
            核心要求：\n1. 文种必须准确（请示必须一文一事，报告不得夹带请示事项）\n2. 格式必须规范（发文字号、签发人、标题、主送机关、附件标注等要素完整）\n\
            3. 语言必须庄重、精炼、准确，禁用网络用语或口语化表达\n4. 政治表述必须与党中央最新精神保持一致\n请开始处理以下需求：\n```\n\
            \n---\n\n## 二、核心任务分类提示词\n**用途**：针对具体公文类型进行专项优化\n\n### 1. 上行文（请示、报告）生成提示词\n\
            \n```\n请根据以下素材，起草一份向上级机关的[请示/报告]。\n【文种要求】：[请示/报告]\n【发文机关】：[单位名称]\n【主送机关】：[上级单位名称]\n\
            【核心内容】：[简要描述需要请示的事项或汇报的工作]\n【格式强制规范】：\n- 如为“请示”：必须做到“一文一事”；在正文后需附注联系人及联系电话（一般为：联系人：XXX\
            \ 电话：XXXXX）\n- 如为“报告”：不得夹带请示事项；结尾可用“专此报告”\n- 发文字号格式：X发〔2024〕X号（年份用六角括号〔〕，不加“第”字，不编虚位）\n\
            - 签发人：上行文必须在版头标注签发人姓名\n请严格按照上述要素生成全文。\n```\n\n### 2. 下行文（通知、通报）格式规范提示词\n\
            \n```\n请起草一份名为《关于[具体事项]的通知》。\n【发文机关】：[单位名称]\n【主送机关】：各科室、下属各单位\n【排版强制指令】：\n\
            1. 标题：二号小标宋体字，居中，回行词意完整（呈梯形或菱形排列）\n2. 正文：三号仿宋体，每面排22行，每行28字\n3. 层次序号规范：\n\
            \   - 第一层：一、 （黑体）\n   - 第二层：（一） （楷体）\n   - 第三层：1. （仿宋体）\n   - 第四层：（1）\
            \ （仿宋体）\n4. 附件说明：正文下空一行，左空二字，附件名称后不加标点\n5. 落款：成文日期右空四字，加盖印章（用括号标注印章位置）\n\
            请结合[核心内容]生成正式公文。\n```\n\n### 3. 政府工作报告/年度计划生成提示词\n\n```\n请根据以下工作要点，起草一份[202X年/季度]工作报告/计划。\n\
            【类型】：[工作总结/工作计划]\n【单位】：[单位名称]\n【时段】：[具体时间段]\n【要点】：\n- 主要成绩/数据：[列出关键数据点]\n\
            - 存在问题：[简述短板]\n- 下一步打算：[简述方向]\n【风格要求】：\n1. 采用“极简版”风格，结构清晰，多用短句、数据支撑\n\
            2. 常用结构：“一、[年份]工作回顾 / 二、[今年]主要预期目标 / 三、[今年]部分重点工作”\n3. 数据表述规范：如“国内生产总值增长X%左右”“城镇新增就业X万人以上”\n\
            4. 专业术语准确：如“新质生产力”“人工智能+”“特别国债”等\n请生成结构完整、语言精炼的报告。\n```\n\n### 4. 规范性文件/政策解读提示词\n\
            \n```\n请将以下政策条文转化为政务公开版的“政策解读”或“非规范性文件”格式。\n【政策名称】：[文件标题]\n【核心内容】：[要点描述]\n\
            【格式要求】：\n1. 采用Word版可粘贴格式，落款靠右侧空2字符，单位与日期居中对齐\n2. 语言通俗易懂，解释“为什么做”“怎么做”“对群众有什么影响”\n\
            3. 严禁直接复制条文，需进行“口语化转官方用语”的转化\n4. 如涉及多个部门，需明确职责分工（参照多部门联合行文规范）\n请生成一份便于公开发布的政策解读材料。\n\
            ```\n\n---\n\n## 三、审校与纠错类提示词\n**用途**：用于模型对已有文稿进行规范性检查\n\n```\n请以“公文审核员”的身份，严格检查以下文稿的错误。\n\
            检查重点：\n1. 文种使用是否正确（有无请示与报告混用、有无在报告中夹带请示事项）\n2. 格式要素是否完整（份号、密级、紧急程度、签发人、发文字号等）\n\
            3. 标题三要素（发文机关+事由+文种）是否齐全\n4. 层次序号是否正确（是否按一、（一）、1.顺序，字体是否正确）\n5. 附件标注是否规范（附件：XXX，后不加标点）\n\
            6. 数字用法是否统一（成文日期用阿拉伯数字全称，如2024年10月22日）\n请在识别出错误后，给出修改后的正确版本。\n[附上需要审核的文稿]\n\
            ```\n\n---\n\n## 四、实操示例组合包\n\n如果你想快速测试模型效果，可以使用这个**“一站式”提示词**：\n\n```\n\
            请根据以下碎片化信息，整合成一份规范的《关于进一步加强网络安全管理的通知》。\n信息素材：\n- 背景：近期发生了两起数据泄露事件\n- 要求1：各部门开展自查，更新密码\n\
            - 要求2：严禁使用非正版软件\n- 要求3：建立应急响应机制\n- 发文单位：局办公室\n- 主送：局属各科室、各事业单位\n- 日期：请设为今天\n\
            请严格按照下行文格式要求生成，并附上附件说明（附件为：网络安全自查表）。\n```\n\n1. **格式要素全覆盖**：结合搜索到的《党政机关公文格式》和各地规范文件，确保发文字号、层次序号、附件标注等细节都被纳入指令。\n\
            2. **高频文种专项处理**：重点覆盖了“请示/报告”（上行文）、“通知”（下行文）和“工作报告”（综合文）三类资政领域最常见的文体。\n\
            3. **错误规避机制**：针对政务文件中的“雷区”（如报告中夹带请示、标题三要素不全、序号乱用）设置了专门检查指令。\n4. **排版可视化**：提示词中直接嵌入了字号、字体、行距要求，引导模型在生成时考虑“印刷效果”。"
